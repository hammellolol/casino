<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin & Account Management - Vegas VIP</title>
  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: rgba(22, 28, 45, 0.95);
      --accent: #f59e0b;
      --text: #f8fafc;
      --danger: #ef4444;
      --success: #10b981;
      --info: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 850px; background: var(--card-bg); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    h1 { color: var(--accent); margin-bottom: 5px; text-align: center; }
    p { color: #94a3b8; text-align: center; margin-bottom: 20px; font-size: 0.9rem; }
    
    .stats-summary-card {
      background: #0f172a; border: 1px solid rgba(245, 158, 11, 0.2); border-radius: 12px;
      padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; text-align: center;
    }
    .stat-box h3 { color: var(--accent); font-size: 1.4rem; margin-top: 4px; }
    .stat-box label { font-size: 0.8rem; color: #94a3b8; }

    .account-card { background: #0f172a; border: 1px solid rgba(255,255,255,0.05); margin: 10px 0; border-radius: 10px; overflow: hidden; }
    .account-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; cursor: pointer; }
    .account-header:hover { background: rgba(255,255,255,0.02); }
    
    .btn { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-info { background: var(--info); color: #fff; }
    .action-group { display: flex; gap: 6px; align-items: center; }

    .stats-details { display: none; padding: 15px; border-top: 1px solid rgba(255,255,255,0.08); background: #080d1a; font-size: 0.85rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
    .stat-item { background: rgba(255,255,255,0.03); padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05); }

    .back-link { display: inline-block; margin-top: 20px; color: var(--accent); text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>👑 Admin & Gesamt-Statistiken</h1>
    <p>Klicke auf einen Account, um seine detaillierten Spielstatistiken auszuklappen.</p>
    
    <div class="stats-summary-card" id="globalStats"></div>

    <div id="accountsList"></div>

    <a href="index.html" class="back-link">← Zurück zum Casino</a>
  </div>

  <script>
    function loadAccounts() {
      const allAccounts = JSON.parse(localStorage.getItem('casino_all_accounts')) || {};
      const listDiv = document.getElementById('accountsList');
      const globalStatsDiv = document.getElementById('globalStats');
      listDiv.innerHTML = '';

      let totalUsers = 0;
      let totalMoney = 0;
      let totalGamesPlayed = 0;

      for (let acc in allAccounts) {
        totalUsers++;
        totalMoney += allAccounts[acc].balance || 0;
        let stats = allAccounts[acc].stats || {};
        for (let g in stats) {
          totalGamesPlayed += stats[g].plays || 0;
        }
      }

      globalStatsDiv.innerHTML = `
        <div class="stat-box"><label>Registrierte Accounts</label><h3>${totalUsers}</h3></div>
        <div class="stat-box"><label>Gesamt-Guthaben</label><h3>${totalMoney.toFixed(2)} €</h3></div>
        <div class="stat-box"><label>Gespielte Runden</label><h3>${totalGamesPlayed}</h3></div>
      `;

      if (Object.keys(allAccounts).length === 0) {
        listDiv.innerHTML = '<p style="text-align:center;">Keine Accounts gefunden.</p>';
        return;
      }

      for (let acc in allAccounts) {
        let data = allAccounts[acc];
        let stats = data.stats || {};
        
        let userTotalPlays = 0;
        let userTotalBet = 0;
        let userTotalWin = 0;

        let statsHtml = '';
        for (let gameId in stats) {
          let st = stats[gameId];
          userTotalPlays += st.plays || 0;
          userTotalBet += st.totalBet || 0;
          userTotalWin += st.totalWin || 0;
          let diff = st.totalWin - st.totalBet;

          statsHtml += `
            <div class="stat-item">
              <strong style="color:var(--accent);">${gameId.toUpperCase()}</strong><br>
              Spiele: ${st.plays}<br>
              Einsatz: ${st.totalBet.toFixed(2)}€<br>
              Gewinn: ${st.totalWin.toFixed(2)}€<br>
              G/V: <span style="color:${diff>=0?'var(--success)':'var(--danger)'}">${diff>=0?'+':''}${diff.toFixed(2)}€</span>
            </div>
          `;
        }

        if (statsHtml === '') {
          statsHtml = '<div style="color:#94a3b8">Noch keine Spiele absolviert.</div>';
        }

        listDiv.innerHTML += `
          <div class="account-card">
            <div class="account-header" onclick="toggleStats('${acc}')">
              <div>
                <strong>${acc}</strong> ${data.isAdmin ? '👑 (Admin)' : ''}
                <div style="font-size:0.8rem; color:#94a3b8;">
                  Guthaben: <span style="color:var(--success); font-weight:bold;">${data.balance.toFixed(2)}€</span> | 
                  Spiele gesamt: <strong>${userTotalPlays}</strong>
                </div>
              </div>
              <div class="action-group" onclick="event.stopPropagation()">
                <button class="btn btn-success" onclick="modifyMoney('${acc}', 100)">+100€</button>
                <button class="btn btn-info" onclick="changePin('${acc}')">PIN</button>
                <button class="btn btn-danger" onclick="deleteAccount('${acc}')">🗑️ Löschen</button>
              </div>
            </div>
            <div class="stats-details" id="stats-${acc}">
              <strong style="color:#fff;">Statistiken für ${acc}:</strong>
              <div style="margin: 5px 0;">Gesamteinsatz: ${userTotalBet.toFixed(2)}€ | Gesamtgewinn: ${userTotalWin.toFixed(2)}€</div>
              <div class="stats-grid">${statsHtml}</div>
            </div>
          </div>
        `;
      }
    }

    function toggleStats(acc) {
      const el = document.getElementById(`stats-${acc}`);
      if (el) {
        el.style.display = el.style.display === 'block' ? 'none' : 'block';
      }
    }

    function modifyMoney(acc, amount) {
      let allAccounts = JSON.parse(localStorage.getItem('casino_all_accounts')) || {};
      if (allAccounts[acc]) {
        allAccounts[acc].balance += amount;
        localStorage.setItem('casino_all_accounts', JSON.stringify(allAccounts));
        loadAccounts();
      }
    }

    function changePin(acc) {
      let newPin = prompt(`Neues Passwort / PIN für Account "${acc}" eingeben:`);
      if (newPin !== null && newPin.trim() !== "") {
        let allAccounts = JSON.parse(localStorage.getItem('casino_all_accounts')) || {};
        if (allAccounts[acc]) {
          allAccounts[acc].pin = newPin.trim();
          localStorage.setItem('casino_all_accounts', JSON.stringify(allAccounts));
          alert(`PIN für "${acc}" erfolgreich auf "${newPin.trim()}" geändert!`);
          loadAccounts();
        }
      }
    }

    /* MACHTVOLLES LÖSCHEN MIT DOPPELTER BESTÄTIGUNG */
    function deleteAccount(acc) {
      if (acc.toLowerCase() === 'admin') {
        alert("Der Haupt-Admin-Account kann nicht gelöscht werden!");
        return;
      }

      // ERSTE BESTÄTIGUNG
      let confirm1 = confirm(`WARNUNG: Möchtest du den Account "${acc}" wirklich unwiderruflich LÖSCHEN?`);
      if (confirm1) {
        // ZWEITE DOPPELTE BESTÄTIGUNG
        let confirm2 = confirm(`BIST DU WIRKLICH SICHER?\nAlle Spieldaten und das Guthaben von "${acc}" werden endgültig gelöscht!`);
        if (confirm2) {
          let allAccounts = JSON.parse(localStorage.getItem('casino_all_accounts')) || {};
          delete allAccounts[acc];
          localStorage.setItem('casino_all_accounts', JSON.stringify(allAccounts));
          alert(`Account "${acc}" wurde erfolgreich gelöscht!`);
          loadAccounts();
        }
      }
    }

    loadAccounts();
  </script>
</body>
</html>
