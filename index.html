<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vegas Royale VIP Casino</title>
  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: rgba(22, 28, 45, 0.95);
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.4);
      --text: #f8fafc;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none; }

    body {
      background-color: var(--bg-dark);
      /* Passender, nicht aufdringlicher Casino-Muster-Hintergrund */
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(30, 41, 59, 0.8), rgba(10, 13, 20, 0.98)),
        radial-gradient(rgba(245, 158, 11, 0.08) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px;
      color: var(--text);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid rgba(245, 158, 11, 0.2);
      padding: 15px 25px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .balance-box {
      font-size: 1.2rem;
      font-weight: 700;
      background: rgba(15, 23, 42, 0.8);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .balance-box span { color: var(--success); font-size: 1.3rem; }

    .refill-btn {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      display: none;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .nav-grid {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .nav-btn {
      background: var(--card-bg);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px 8px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
    }

    .nav-btn img { width: 24px; height: 24px; object-fit: contain; }

    .nav-btn:hover, .nav-btn.active {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(245, 158, 11, 0.15);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .game-container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 25px;
      min-height: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      position: relative;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    input[type="number"] {
      width: 100px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
    }

    button.action-btn {
      background: linear-gradient(135deg, var(--accent), #d97706);
      color: #000;
      font-weight: 800;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.1s;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    button.action-btn:active { transform: scale(0.96); }

    /* Event Display Message (Keine Popups mehr) */
    .status-msg {
      margin-top: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      min-height: 28px;
      text-align: center;
      color: #e2e8f0;
    }
    .status-msg.win { color: var(--success); text-shadow: 0 0 10px rgba(16,185,129,0.5); }
    .status-msg.lose { color: var(--danger); }

    /* Slots */
    .slot-machine {
      display: flex;
      gap: 15px;
      background: #090d16;
      padding: 20px;
      border-radius: 16px;
      border: 3px solid var(--accent);
      box-shadow: inset 0 0 20px #000;
    }
    .slot-reel {
      width: 70px;
      height: 70px;
      background: #1e293b;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .slot-reel img { width: 50px; height: 50px; transition: transform 0.1s; }
    .spinning img { filter: blur(2px); animation: spin 0.1s infinite linear; }

    @keyframes spin { 0% { transform: translateY(-10px); } 100% { transform: translateY(10px); } }

    /* Cards */
    .card-img { width: 80px; height: 115px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: transform 0.3s; }
    
    /* 3D Coin Flip */
    .coin-3d {
      width: 90px;
      height: 90px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s ease-out;
    }
    .coin-3d img { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; }
    .coin-3d .back { transform: rotateY(180deg); }

    /* Mines Grid */
    .grid-3x3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .grid-btn { width: 75px; height: 75px; background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .grid-btn img { width: 45px; height: 45px; }

    canvas { max-width: 100%; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      Vegas VIP
    </div>
    <div class="balance-box">
      Guthaben: <span id="balance">100.00</span> €
    </div>
    <button id="refillBtn" class="refill-btn" onclick="refillBalance()">+20€ Gratis Guthaben</button>
  </header>

  <div class="nav-grid" id="navGrid"></div>

  <div class="game-container" id="gameContainer"></div>

  <script>
    // Grafiken via SVG Data URIs (keine externen Ladefehler möglich!)
    const IMGS = {
      chip: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23f59e0b" stroke="%23fff" stroke-width="6"/><circle cx="50" cy="50" r="30" fill="none" stroke="%23fff" stroke-width="4" stroke-dasharray="8 8"/><text x="50" y="58" font-size="22" font-weight="bold" text-anchor="middle" fill="%23fff">VIP</text></svg>',
      seven: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text x="50" y="75" font-size="70" font-weight="900" text-anchor="middle" fill="%23ef4444">7</text></svg>',
      cherry: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="35" cy="65" r="18" fill="%23dc2626"/><circle cx="65" cy="70" r="18" fill="%23dc2626"/><path d="M35 65 Q 50 20 60 15 Q 50 30 65 70" fill="none" stroke="%2316a34a" stroke-width="5"/></svg>',
      diamond: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="50,15 85,40 50,85 15,40" fill="%2338bdf8" stroke="%23fff" stroke-width="3"/></svg>',
      lemon: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="35" ry="25" fill="%23eab308" transform="rotate(-25 50 50)"/></svg>',
      cardBack: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140"><rect x="5" y="5" width="90" height="130" rx="8" fill="%231e3a8a" stroke="%23fff" stroke-width="4"/><rect x="15" y="15" width="70" height="110" rx="4" fill="none" stroke="%233b82f6" stroke-width="2" stroke-dasharray="6 6"/></svg>',
      cardAce: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140"><rect x="5" y="5" width="90" height="130" rx="8" fill="%23fff"/><text x="20" y="30" font-size="20" font-weight="bold" fill="%23dc2626">A♠</text><polygon points="50,50 65,75 50,70 35,75" fill="%231e293b"/></svg>',
      bomb: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="55" r="30" fill="%23000"/><path d="M50 25 Q 60 10 70 15" stroke="%23f59e0b" stroke-width="4" fill="none"/></svg>',
      coinHeads: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23eab308" stroke="%23ca8a04" stroke-width="5"/><text x="50" y="60" font-size="30" font-weight="bold" text-anchor="middle" fill="%2378350f">KOPF</text></svg>',
      coinTails: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%2394a3b8" stroke="%2364748b" stroke-width="5"/><text x="50" y="60" font-size="30" font-weight="bold" text-anchor="middle" fill="%231e293b">ZAHL</text></svg>'
    };

    const GAMES = [
      { id: 'slots', name: 'Slots', img: IMGS.seven },
      { id: 'plinko', name: 'Plinko', img: IMGS.chip },
      { id: 'roulette', name: 'Roulette', img: IMGS.chip },
      { id: 'blackjack', name: 'Blackjack', img: IMGS.cardAce },
      { id: 'coinflip', name: 'Coinflip', img: IMGS.coinHeads },
      { id: 'mines', name: 'Mines', img: IMGS.bomb },
      { id: 'dice', name: 'Würfel', img: IMGS.chip },
      { id: 'wheel', name: 'Glücksrad', img: IMGS.chip },
      { id: 'higherlower', name: 'Höher/Tiefer', img: IMGS.cardAce },
      { id: 'keno', name: 'Keno', img: IMGS.chip }
    ];

    let balance = parseFloat(localStorage.getItem('casino_balance_v2')) || 100;
    let currentGame = 'slots';

    function initNav() {
      const nav = document.getElementById('navGrid');
      nav.innerHTML = GAMES.map(g => `
        <button class="nav-btn ${g.id === currentGame ? 'active' : ''}" onclick="switchGame('${g.id}')">
          <img src="${g.img}" alt="${g.name}">
          ${g.name}
        </button>
      `).join('');
    }

    function updateBalance(amount) {
      balance += amount;
      balance = Math.round(balance * 100) / 100;
      localStorage.setItem('casino_balance_v2', balance);
      document.getElementById('balance').innerText = balance.toFixed(2);
      
      const refillBtn = document.getElementById('refillBtn');
      refillBtn.style.display = balance <= 0 ? 'block' : 'none';
    }

    function refillBalance() {
      if (balance <= 0) {
        updateBalance(20);
        showMsg("Du hast 20,00 € Gratis-Guthaben erhalten!", "win");
      }
    }

    function switchGame(gameId) {
      currentGame = gameId;
      initNav();
      renderGame();
    }

    function showMsg(text, type = '') {
      const el = document.getElementById('statusMsg');
      if (el) {
        el.className = `status-msg ${type}`;
        el.innerText = text;
      }
    }

    function checkBet() {
      const input = document.getElementById('betAmount');
      const bet = parseFloat(input?.value || 0);
      if (isNaN(bet) || bet <= 0) {
        showMsg("Ungültiger Einsatz!", "lose");
        return false;
      }
      if (bet > balance) {
        showMsg("Nicht genügend Guthaben!", "lose");
        return false;
      }
      return bet;
    }

    function getBetUI() {
      return `
        <div class="controls">
          <label>Einsatz (€):</label>
          <input type="number" id="betAmount" value="5" min="1" max="${Math.max(1, balance)}">
        </div>
      `;
    }

    function renderGame() {
      const container = document.getElementById('gameContainer');
      container.innerHTML = '';

      switch(currentGame) {
        case 'slots':
          container.innerHTML = `
            <h2>VIP Slots</h2>
            <div class="slot-machine">
              <div class="slot-reel" id="reel0"><img src="${IMGS.seven}"></div>
              <div class="slot-reel" id="reel1"><img src="${IMGS.cherry}"></div>
              <div class="slot-reel" id="reel2"><img src="${IMGS.diamond}"></div>
            </div>
            ${getBetUI()}
            <button class="action-btn" onclick="playSlots()">Drehen</button>
            <div class="status-msg" id="statusMsg"></div>
          `;
          break;

        case 'plinko':
          container.innerHTML = `
            <h2>Plinko</h2>
            <canvas id="plinkoCanvas" width="320" height="280"></canvas>
            ${getBetUI()}
            <button class="action-btn" onclick="playPlinko()">Kugel fallen lassen</button>
            <div class="status-msg" id="statusMsg"></div>
          `;
          drawPlinkoBoard();
          break;

        case 'roulette':
          container.innerHTML = `
            <h2>Roulette</h2>
            <canvas id="rouletteCanvas" width="260" height="260"></canvas>
            ${getBetUI()}
            <div class="controls">
              <button class="action-btn" style="background:#ef4444;color:#fff" onclick="playRoulette('red')">Rot (x2)</button>
              <button class="action-btn" style="background:#10b981;color:#fff" onclick="playRoulette('green')">Grün (x14)</button>
              <button class="action-btn" style="background:#1e293b;color:#fff" onclick="playRoulette('black')">Schwarz (x2)</button>
            </div>
            <div class="status-msg" id="statusMsg"></div>
          `;
          drawRouletteWheel(0);
          break;

        case 'coinflip':
          container.innerHTML = `
            <h2>3D Coinflip</h2>
            <div class="coin-3d" id="coin">
              <img src="${IMGS.coinHeads}" class="front">
              <img src="${IMGS.coinTails}" class="back">
            </div>
            ${getBetUI()}
            <div class="controls">
              <button class="action-btn" onclick="playCoinflip('Kopf')">Kopf</button>
              <button class="action-btn" onclick="playCoinflip('Zahl')">Zahl</button>
            </div>
            <div class="status-msg" id="statusMsg"></div>
          `;
          break;

        case 'mines':
          container.innerHTML = `
            <h2>Mines</h2>
            <div class="grid-3x3" id="minesGrid"></div>
            ${getBetUI()}
            <button class="action-btn" style="margin-top:10px;" onclick="startMines()">Neues Feld starten</button>
            <div class="status-msg" id="statusMsg"></div>
          `;
          initMinesUI();
          break;

        case 'blackjack':
          container.innerHTML = `
            <h2>Blackjack</h2>
            <div style="display:flex; gap:20px; margin:20px 0;">
              <div>
                <p>Dealer</p>
                <img src="${IMGS.cardBack}" class="card-img" id="bjDealerCard">
              </div>
              <div>
                <p>Du</p>
                <img src="${IMGS.cardAce}" class="card-img" id="bjPlayerCard">
              </div>
            </div>
            ${getBetUI()}
            <button class="action-btn" onclick="playBlackjack()">Karte ziehen & Vergleichen</button>
            <div class="status-msg" id="statusMsg"></div>
          `;
          break;

        case 'dice':
          container.innerHTML = `
            <h2>Würfel (Gewinn bei > 3)</h2>
            <div style="font-size:3rem; margin:15px;" id="diceBox">🎲</div>
            ${getBetUI()}
            <button class="action-btn" onclick="playDice()">Würfeln</button>
            <div class="status-msg" id="statusMsg"></div>
          `;
          break;

        case 'wheel':
          container.innerHTML = `
            <h2>Glücksrad</h2>
            <canvas id="wheelCanvas" width="240" height="240"></canvas>
            ${getBetUI()}
            <button class="action-btn" onclick="playWheel()">Rad drehen</button>
            <div class="status-msg" id="statusMsg"></div>
          `;
          drawSimpleWheel(0);
          break;

        case 'higherlower':
          container.innerHTML = `
            <h2>Höher oder Tiefer</h2>
            <div style="margin:15px 0;">
              <p>Aktuelle Karte Wert: <strong id="hlVal" style="font-size:1.4rem; color:var(--accent)">7</strong></p>
            </div>
            ${getBetUI()}
            <div class="controls">
              <button class="action-btn" onclick="playHL('higher')">Höher ⬆️</button>
              <button class="action-btn" onclick="playHL('lower')">Tiefer ⬇️</button>
            </div>
            <div class="status-msg" id="statusMsg"></div>
          `;
          break;

        case 'keno':
          container.innerHTML = `
            <h2>Keno (Zahl 1-5 tippen)</h2>
            ${getBetUI()}
            <div class="controls" style="margin-top:15px;">
              ${[1,2,3,4,5].map(n => `<button class="action-btn" onclick="playKeno(${n})">${n}</button>`).join('')}
            </div>
            <div class="status-msg" id="statusMsg"></div>
          `;
          break;
      }
    }

    /* --- MINIGAME ANIMATIONEN & LOGIK --- */

    // 1. SLOTS
    function playSlots() {
      const bet = checkBet();
      if (!bet) return;
      updateBalance(-bet);
      showMsg("Walzen drehen...", "");

      const symbols = [IMGS.seven, IMGS.cherry, IMGS.diamond, IMGS.lemon];
      const reels = [document.getElementById('reel0'), document.getElementById('reel1'), document.getElementById('reel2')];
      
      reels.forEach(r => r.classList.add('spinning'));

      setTimeout(() => {
        const res = [
          symbols[Math.floor(Math.random() * symbols.length)],
          symbols[Math.floor(Math.random() * symbols.length)],
          symbols[Math.floor(Math.random() * symbols.length)]
        ];

        reels.forEach((r, idx) => {
          r.classList.remove('spinning');
          r.innerHTML = `<img src="${res[idx]}">`;
        });

        if (res[0] === res[1] && res[1] === res[2]) {
          const win = bet * 5;
          updateBalance(win);
          showMsg(`🎉 JACKPOT! 3x Match! Gewinn: +${win.toFixed(2)}€`, 'win');
        } else if (res[0] === res[1] || res[1] === res[2] || res[0] === res[2]) {
          const win = bet * 1.5;
          updateBalance(win);
          showMsg(`✨ 2x Match! Gewinn: +${win.toFixed(2)}€`, 'win');
        } else {
          showMsg("Leider kein Treffer. Versuch es nochmal!", "lose");
        }
      }, 700);
    }

    // 2. PLINKO
    function drawPlinkoBoard() {
      const cvs = document.getElementById('plinkoCanvas');
      if (!cvs) return;
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0, 0, 320, 280);

      // Pins
      ctx.fillStyle = '#94a3b8';
      for (let r = 2; r <= 6; r++) {
        for (let c = 0; c <= r; c++) {
          ctx.beginPath();
          ctx.arc(160 - (r * 18) + (c * 36), r * 35, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Multiplikatoren inklusive zwei 1x in der Mitte
      const mults = ['5x', '2x', '1x', '1x', '2x', '5x'];
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      for (let i = 0; i < mults.length; i++) {
        ctx.fillStyle = (i === 2 || i === 3) ? '#f59e0b' : '#10b981';
        ctx.fillRect(15 + i * 50, 240, 40, 25);
        ctx.fillStyle = '#000';
        ctx.fillText(mults[i], 35 + i * 50, 257);
      }
    }

    function playPlinko() {
      const bet = checkBet();
      if (!bet) return;
      updateBalance(-bet);

      const mults = [5, 2, 1, 1, 2, 5];
      const targetIdx = Math.floor(Math.random() * mults.length);
      const mult = mults[targetIdx];

      let ballY = 40;
      let ballX = 160;
      const targetX = 35 + targetIdx * 50;

      const timer = setInterval(() => {
        ballY += 12;
        ballX += (targetX - ballX) * 0.12;

        drawPlinkoBoard();
        const cvs = document.getElementById('plinkoCanvas');
        const ctx = cvs.getContext('2d');
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(ballX, ballY, 8, 0, Math.PI * 2);
        ctx.fill();

        if (ballY >= 230) {
          clearInterval(timer);
          const win = bet * mult;
          updateBalance(win);
          showMsg(`Kugel gelandet auf ${mult}x! Gewinn: +${win.toFixed(2)}€`, mult >= 1 ? 'win' : 'lose');
        }
      }, 30);
    }

    // 3. ROULETTE
    function drawRouletteWheel(angle) {
      const cvs = document.getElementById('rouletteCanvas');
      if (!cvs) return;
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0, 0, 260, 260);

      const slices = 12;
      const arc = (Math.PI * 2) / slices;

      for (let i = 0; i < slices; i++) {
        ctx.beginPath();
        ctx.fillStyle = i === 0 ? '#10b981' : (i % 2 === 0 ? '#ef4444' : '#1e293b');
        ctx.moveTo(130, 130);
        ctx.arc(130, 130, 110, angle + i * arc, angle + (i + 1) * arc);
        ctx.fill();
      }

      // Center
      ctx.fillStyle = '#0a0d14';
      ctx.beginPath();
      ctx.arc(130, 130, 40, 0, Math.PI * 2);
      ctx.fill();

      // Ball Pointer
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(130, 30, 7, 0, Math.PI * 2);
      ctx.fill();
    }

    function playRoulette(choice) {
      const bet = checkBet();
      if (!bet) return;
      updateBalance(-bet);
      showMsg("Rad dreht sich...", "");

      let currentAngle = 0;
      let speed = 0.4;

      const timer = setInterval(() => {
        currentAngle += speed;
        speed *= 0.96;
        drawRouletteWheel(currentAngle);

        if (speed < 0.01) {
          clearInterval(timer);
          const rand = Math.random();
          let color = 'black';
          if (rand < 0.08) color = 'green';
          else if (rand < 0.54) color = 'red';

          if (choice === color) {
            const win = bet * (color === 'green' ? 14 : 2);
            updateBalance(win);
            showMsg(`Kugel stoppt auf ${color.toUpperCase()}! Gewinn: +${win.toFixed(2)}€`, 'win');
          } else {
            showMsg(`Kugel stoppt auf ${color.toUpperCase()}. Verloren!`, 'lose');
          }
        }
      }, 30);
    }

    // 4. COINFLIP
    function playCoinflip(choice) {
      const bet = checkBet();
      if (!bet) return;
      updateBalance(-bet);

      const coin = document.getElementById('coin');
      const isHeads = Math.random() < 0.5;
      const flips = 5; 
      const deg = flips * 360 + (isHeads ? 0 : 180);

      coin.style.transform = `rotateY(${deg}deg)`;

      setTimeout(() => {
        const result = isHeads ? 'Kopf' : 'Zahl';
        if (choice === result) {
          const win = bet * 2;
          updateBalance(win);
          showMsg(`Richtig! Es ist ${result}. Gewinn: +${win.toFixed(2)}€`, 'win');
        } else {
          showMsg(`Falsch! Es war ${result}.`, 'lose');
        }
      }, 1000);
    }

    // 5. MINES
    let mineLocation = -1;
    let mineActive = false;

    function initMinesUI() {
      const grid = document.getElementById('minesGrid');
      grid.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        grid.innerHTML += `<button class="grid-btn" id="mBtn${i}" onclick="clickMine(${i})"><img src="${IMGS.chip}"></button>`;
      }
      mineActive = false;
    }

    function startMines() {
      const bet = checkBet();
      if (!bet) return;
      mineLocation = Math.floor(Math.random() * 9);
      mineActive = true;
      initMinesUI();
      showMsg("Feld bereit. Klicke auf ein Feld!", "");
    }

    function clickMine(idx) {
      if (!mineActive) {
        showMsg("Starte zuerst ein neues Feld!", "lose");
        return;
      }
      const bet = checkBet();
      if (!bet) return;

      const btn = document.getElementById(`mBtn${idx}`);
      if (idx === mineLocation) {
        btn.innerHTML = `<img src="${IMGS.bomb}">`;
        btn.style.background = '#ef4444';
        mineActive = false;
        updateBalance(-bet);
        showMsg("BOOM! Mine getroffen. Einsatz verloren!", "lose");
      } else {
        btn.innerHTML = `<img src="${IMGS.diamond}">`;
        btn.style.background = '#10b981';
        btn.disabled = true;
        const win = bet * 1.4;
        updateBalance(win - bet);
        showMsg(`Diamant! +${(win - bet).toFixed(2)}€`, 'win');
      }
    }

    // 6. BLACKJACK
    function playBlackjack() {
      const bet = checkBet();
      if (!bet) return;
      updateBalance(-bet);

      const playerVal = Math.floor(Math.random() * 8) + 14;
      const dealerVal = Math.floor(Math.random() * 8) + 14;

      if (playerVal > dealerVal && playerVal <= 21) {
        const win = bet * 2;
        updateBalance(win);
        showMsg(`Du: ${playerVal} vs Dealer: ${dealerVal}. Gewinn: +${win.toFixed(2)}€`, 'win');
      } else if (playerVal === dealerVal) {
        updateBalance(bet);
        showMsg(`Du: ${playerVal} vs Dealer: ${dealerVal}. Unentschieden!`, '');
      } else {
        showMsg(`Du: ${playerVal} vs Dealer: ${dealerVal}. Dealer gewinnt!`, 'lose');
      }
    }

    // 7. DICE
    function playDice() {
      const bet = checkBet();
      if (!bet) return;
      updateBalance(-bet);

      const roll = Math.floor(Math.random() * 6) + 1;
      document.getElementById('diceBox').innerText = `🎲 ${roll}`;

      if (roll > 3) {
        const win = bet * 1.8;
        updateBalance(win);
        showMsg(`Gewürfelt: ${roll}! Gewinn: +${win.toFixed(2)}€`, 'win');
      } else {
        showMsg(`Gewürfelt: ${roll}. Verloren!`, 'lose');
      }
    }

    // 8. WHEEL
    function drawSimpleWheel(angle) {
      const cvs = document.getElementById('wheelCanvas');
      if (!cvs) return;
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0,0,240,240);
      const mults = ['0x', '1.5x', '2x', '0.5x', '5x', '1x'];
      const arc = (Math.PI * 2) / mults.length;

      for (let i = 0; i < mults.length; i++) {
        ctx.beginPath();
        ctx.fillStyle = `hsl(${i * 60}, 70%, 50%)`;
        ctx.moveTo(120, 120);
        ctx.arc(120, 120, 100, angle + i * arc, angle + (i + 1) * arc);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText(mults[i], 120 + Math.cos(angle + i * arc + arc/2) * 65, 125 + Math.sin(angle + i * arc + arc/2) * 65);
      }
    }

    function playWheel() {
      const bet = checkBet();
      if (!bet) return;
      updateBalance(-bet);

      const mults = [0, 1.5, 2, 0.5, 5, 1];
      const idx = Math.floor(Math.random() * mults.length);
      const mult = mults[idx];

      let ang = 0;
      const timer = setInterval(() => {
        ang += 0.3;
        drawSimpleWheel(ang);
      }, 30);

      setTimeout(() => {
        clearInterval(timer);
        const win = bet * mult;
        updateBalance(win);
        showMsg(`Rad stoppt bei ${mult}x! Gewinn: +${win.toFixed(2)}€`, mult >= 1 ? 'win' : 'lose');
      }, 1000);
    }

    // 9. HIGHER/LOWER
    let currentHLCard = 7;
    function playHL(choice) {
      const bet = checkBet();
      if (!bet) return;
      updateBalance(-bet);

      const nextCard = Math.floor(Math.random() * 12) + 1;
      document.getElementById('hlVal').innerText = nextCard;

      const winCond = (choice === 'higher' && nextCard >= currentHLCard) || (choice === 'lower' && nextCard <= currentHLCard);

      if (winCond) {
        const win = bet * 1.8;
        updateBalance(win);
        showMsg(`Richtig! Neue Karte: ${nextCard}. Gewinn: +${win.toFixed(2)}€`, 'win');
      } else {
        showMsg(`Falsch! Neue Karte war ${nextCard}.`, 'lose');
      }
      currentHLCard = nextCard;
    }

    // 10. KENO
    function playKeno(choice) {
      const bet = checkBet();
      if (!bet) return;
      updateBalance(-bet);

      const drawn = Math.floor(Math.random() * 5) + 1;
      if (choice === drawn) {
        const win = bet * 4;
        updateBalance(win);
        showMsg(`Treffer! Gezogene Zahl: ${drawn}. Gewinn: +${win.toFixed(2)}€`, 'win');
      } else {
        showMsg(`Leider daneben. Gezogene Zahl war: ${drawn}`, 'lose');
      }
    }

    // Initialisierung
    initNav();
    renderGame();
    updateBalance(0);
  </script>
</body>
</html>
