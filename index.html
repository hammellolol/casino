<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vegas Royale VIP Casino</title>
  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: rgba(22, 28, 45, 0.95);
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.4);
      --text: #f8fafc;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(30, 41, 59, 0.8), rgba(10, 13, 20, 0.98)),
        radial-gradient(rgba(245, 158, 11, 0.08) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px;
      color: var(--text);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid rgba(245, 158, 11, 0.2);
      padding: 15px 25px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .balance-box {
      font-size: 1.2rem;
      font-weight: 700;
      background: rgba(15, 23, 42, 0.8);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .balance-box span { color: var(--success); font-size: 1.3rem; }

    .refill-btn {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      display: none;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .nav-grid {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .nav-btn {
      background: var(--card-bg);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 6px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
    }

    .nav-icon { font-size: 1.5rem; }

    .nav-btn:hover, .nav-btn.active {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(245, 158, 11, 0.15);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .game-container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 25px;
      min-height: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      text-align: center;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    input[type="number"] {
      width: 100px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
    }

    button.action-btn {
      background: linear-gradient(135deg, var(--accent), #d97706);
      color: #000;
      font-weight: 800;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.1s;
      box-shadow: 0 4px 15px var(--accent-glow);
      margin-top: 15px;
    }

    button.action-btn:active { transform: scale(0.96); }

    .status-msg {
      margin-top: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      min-height: 28px;
      text-align: center;
      color: #e2e8f0;
    }
    .status-msg.win { color: var(--success); text-shadow: 0 0 10px rgba(16,185,129,0.5); }
    .status-msg.lose { color: var(--danger); }

    /* Slots Styling */
    .slot-machine {
      display: flex;
      gap: 15px;
      background: #090d16;
      padding: 20px;
      border-radius: 16px;
      border: 3px solid var(--accent);
      box-shadow: inset 0 0 20px #000;
      margin: 15px 0;
    }
    .slot-reel {
      width: 75px;
      height: 75px;
      background: #1e293b;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .spinning { animation: shake 0.1s infinite; }
    @keyframes shake { 0% { transform: translateY(-2px); } 100% { transform: translateY(2px); } }

    /* Coinflip 3D */
    .coin-box {
      width: 100px;
      height: 100px;
      background: #eab308;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: #78350f;
      border: 4px solid #fef08a;
      box-shadow: 0 8px 20px rgba(234, 179, 8, 0.4);
      margin: 15px auto;
      transition: transform 0.8s ease-out;
    }

    /* Mines & Grids */
    .grid-3x3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
    .grid-btn { width: 70px; height: 70px; background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; cursor: pointer; font-size: 1.8rem; display: flex; align-items: center; justify-content: center; }
    
    canvas { background: #090d16; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); margin: 10px 0; }
  </style>
</head>
<body>

  <header>
    <div class="brand">💎 Vegas VIP</div>
    <div class="balance-box">Guthaben: <span id="balance">100.00</span> €</div>
    <button id="refillBtn" class="refill-btn" onclick="refillBalance()">+20€ Gratis Guthaben</button>
  </header>

  <div class="nav-grid" id="navGrid"></div>
  <div class="game-container" id="gameContainer"></div>

  <script>
    const GAMES = [
      { id: 'slots', name: 'Slots', icon: '🎰' },
      { id: 'plinko', name: 'Plinko', icon: '⚪' },
      { id: 'roulette', name: 'Roulette', icon: '🎡' },
      { id: 'blackjack', name: 'Blackjack', icon: '🃏' },
      { id: 'coinflip', name: 'Coinflip', icon: '🪙' },
      { id: 'mines', name: 'Mines', icon: '💣' },
      { id: 'dice', name: 'Würfel', icon: '🎲' },
      { id: 'wheel', name: 'Glücksrad', icon: '🎯' },
      { id: 'higherlower', name: 'Höher/Tiefer', icon: '📈' },
      { id: 'keno', name: 'Keno', icon: '🔢' }
    ];

    let balance = parseFloat(localStorage.getItem('casino_balance_v3')) || 100;
    let currentGame = 'slots';

    function initNav() {
      const nav = document.getElementById('navGrid');
      nav.innerHTML = GAMES.map(g => `
        <button class="nav-btn ${g.id === currentGame ? 'active' : ''}" onclick="switchGame('${g.id}')">
          <span class="nav-icon">${g.icon}</span>
          ${g.name}
        </button>
      `).join('');
    }

    function updateBalance(amount) {
      balance += amount;
      balance = Math.round(balance * 100) / 100;
      localStorage.setItem('casino_balance_v3', balance);
      document.getElementById('balance').innerText = balance.toFixed(2);
      document.getElementById('refillBtn').style.display = balance <= 0 ? 'block' : 'none';
    }

    function refillBalance() {
      if (balance <= 0) {
        updateBalance(20);
        showMsg("Du hast 20,00 € Gratis-Guthaben erhalten!", "win");
      }
    }

    function switchGame(gameId) {
      currentGame = gameId;
      initNav();
      renderGame();
    }

    function showMsg(text, type = '') {
      const el = document.getElementById('statusMsg');
      if (el) {
        el.className = `status-msg ${type}`;
        el.innerText = text;
      }
    }

    function checkBet() {
      const bet = parseFloat(document.getElementById('betAmount')?.value || 0);
      if (isNaN(bet) || bet <= 0) { showMsg("Ungültiger Einsatz!", "lose"); return false; }
      if (bet > balance) { showMsg("Nicht genügend Guthaben!", "lose"); return false; }
      return bet;
    }

    function getBetUI() {
      return `
        <div class="controls">
          <label>Einsatz (€):</label>
          <input type="number" id="betAmount" value="5" min="1" max="${Math.max(1, balance)}">
        </div>
      `;
    }

    function renderGame() {
      const container = document.getElementById('gameContainer');
      container.innerHTML = '';

      switch(currentGame) {
        case 'slots':
          container.innerHTML = `
            <h2>VIP Slots</h2>
            <div class="slot-machine">
              <div class="slot-reel" id="reel0">🍒</div>
              <div class="slot-reel" id="reel1">🍋</div>
              <div class="slot-reel" id="reel2">💎</div>
            </div>
            ${getBetUI()}
            <button class="action-btn" onclick="playSlots()">Drehen</button>
            <div class="status-msg" id="statusMsg"></div>
          `;
          break;

        case 'plinko':
          container.innerHTML = `
            <h2>Plinko</h2>
            <canvas id="plinkoCanvas" width="320" height="260"></canvas>
            ${getBetUI()}
            <button class="action-btn" onclick="playPlinko()">Kugel fallen lassen</button>
            <div class="status-msg" id="statusMsg"></div>
          `;
          drawPlinkoBoard();
          break;

        case 'roulette':
          container.innerHTML = `
            <h2>Roulette</h2>
            <canvas id="rouletteCanvas" width="240" height="240"></canvas>
            ${getBetUI()}
            <div class="controls">
              <button class="action-btn" style="background:#ef4444;color:#fff;margin:0;" onclick="playRoulette('red')">Rot (x2)</button>
              <button class="action-btn" style="background:#10b981;color:#fff;margin:0;" onclick="playRoulette('green')">Grün (x14)</button>
              <button class="action-btn" style="background:#334155;color:#fff;margin:0;" onclick="playRoulette('black')">Schwarz (x2)</button>
            </div>
            <div class="status-msg" id="statusMsg"></div>
          `;
          drawRouletteWheel(0);
          break;

        case 'coinflip':
          container.innerHTML = `
            <h2>Coinflip</h2>
            <div class="coin-box" id="coinBox">KOPF</div>
            ${getBetUI()}
            <div class="controls">
              <button class="action-btn" style="margin:0;" onclick="playCoinflip('Kopf')">Kopf</button>
              <button class="action-btn" style="margin:0;" onclick="playCoinflip('Zahl')">Zahl</button>
            </div>
            <div class="status-msg" id="statusMsg"></div>
          `;
          break;

        case 'mines':
          container.innerHTML = `
            <h2>Mines</h2>
            <div class="grid-3x3" id="minesGrid"></div>
            ${getBetUI()}
            <button class="action-btn" onclick="startMines()">Neues Feld starten</button>
            <div class="status-msg" id="statusMsg"></div>
          `;
          initMinesUI();
          break;

        case 'blackjack':
          container.innerHTML = `
            <h2>Blackjack</h2>
            <div style="font-size: 3rem; margin: 15px;">🃏</div>
            ${getBetUI()}
            <button class="action-btn" onclick="playBlackjack()">Spielen</button>
            <div class="status-msg" id="statusMsg"></div>
          `;
          break;

        case 'dice':
          container.innerHTML = `
            <h2>Würfel (Gewinn bei > 3)</h2>
            <div style="font-size: 3rem; margin: 15px;" id="diceBox">🎲</div>
            ${getBetUI()}
            <button class="action-btn" onclick="playDice()">Würfeln</button>
            <div class="status-msg" id="statusMsg"></div>
          `;
          break;

        case 'wheel':
          container.innerHTML = `
            <h2>Glücksrad</h2>
            <canvas id="wheelCanvas" width="240" height="240"></canvas>
            ${getBetUI()}
            <button class="action-btn" onclick="playWheel()">Rad drehen</button>
            <div class="status-msg" id="statusMsg"></div>
          `;
          drawSimpleWheel(0);
          break;

        case 'higherlower':
          container.innerHTML = `
            <h2>Höher oder Tiefer</h2>
            <div style="margin:15px 0; font-size: 1.5rem;">Aktuelle Karte: <strong id="hlVal" style="color:var(--accent)">7</strong></div>
            ${getBetUI()}
            <div class="controls">
              <button class="action-btn" style="margin:0;" onclick="playHL('higher')">Höher ⬆️</button>
              <button class="action-btn" style="margin:0;" onclick="playHL('lower')">Tiefer ⬇️</button>
            </div>
            <div class="status-msg" id="statusMsg"></div>
          `;
          break;

        case 'keno':
          container.innerHTML = `
            <h2>Keno (Zahl 1-5 tippen)</h2>
            ${getBetUI()}
            <div class="controls" style="margin-top:15px;">
              ${[1,2,3,4,5].map(n => `<button class="action-btn" style="margin:0;" onclick="playKeno(${n})">${n}</button>`).join('')}
            </div>
            <div class="status-msg" id="statusMsg"></div>
          `;
          break;
      }
    }

    // SLOTS
    function playSlots() {
      const bet = checkBet(); if (!bet) return;
      updateBalance(-bet);
      showMsg("Walzen drehen...", "");
      const syms = ['🍒', '🍋', '💎', '🔔', '7️⃣'];
      const r0 = document.getElementById('reel0'), r1 = document.getElementById('reel1'), r2 = document.getElementById('reel2');
      r0.classList.add('spinning'); r1.classList.add('spinning'); r2.classList.add('spinning');

      setTimeout(() => {
        r0.classList.remove('spinning'); r1.classList.remove('spinning'); r2.classList.remove('spinning');
        const s0 = syms[Math.floor(Math.random()*syms.length)];
        const s1 = syms[Math.floor(Math.random()*syms.length)];
        const s2 = syms[Math.floor(Math.random()*syms.length)];
        r0.innerText = s0; r1.innerText = s1; r2.innerText = s2;

        if (s0 === s1 && s1 === s2) {
          const win = bet * 5; updateBalance(win); showMsg(`JACKPOT! +${win.toFixed(2)}€`, 'win');
        } else if (s0 === s1 || s1 === s2 || s0 === s2) {
          const win = bet * 1.5; updateBalance(win); showMsg(`2x Match! +${win.toFixed(2)}€`, 'win');
        } else {
          showMsg("Leider verloren.", "lose");
        }
      }, 600);
    }

    // PLINKO
    function drawPlinkoBoard() {
      const cvs = document.getElementById('plinkoCanvas');
      if (!cvs) return;
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0,0,320,260);
      ctx.fillStyle = '#94a3b8';
      for (let r=2; r<=6; r++) {
        for (let c=0; c<=r; c++) {
          ctx.beginPath(); ctx.arc(160 - (r*16) + (c*32), r*30, 3, 0, Math.PI*2); ctx.fill();
        }
      }
      const mults = ['5x', '2x', '1x', '1x', '2x', '5x'];
      ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      for (let i=0; i<mults.length; i++) {
        ctx.fillStyle = (i===2 || i===3) ? '#f59e0b' : '#10b981';
        ctx.fillRect(15 + i*48, 220, 38, 22);
        ctx.fillStyle = '#000'; ctx.fillText(mults[i], 34 + i*48, 235);
      }
    }

    function playPlinko() {
      const bet = checkBet(); if (!bet) return;
      updateBalance(-bet);
      const mults = [5, 2, 1, 1, 2, 5];
      const idx = Math.floor(Math.random() * mults.length);
      const mult = mults[idx];
      let y = 30, x = 160, targetX = 34 + idx * 48;

      const t = setInterval(() => {
        y += 10; x += (targetX - x) * 0.15;
        drawPlinkoBoard();
        const cvs = document.getElementById('plinkoCanvas');
        const ctx = cvs.getContext('2d');
        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI*2); ctx.fill();
        if (y >= 210) {
          clearInterval(t);
          const win = bet * mult; updateBalance(win);
          showMsg(`Plinko ${mult}x! Gewinn: +${win.toFixed(2)}€`, mult >= 1 ? 'win' : 'lose');
        }
      }, 30);
    }

    // ROULETTE
    function drawRouletteWheel(ang) {
      const cvs = document.getElementById('rouletteCanvas');
      if (!cvs) return;
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0,0,240,240);
      for (let i=0; i<12; i++) {
        ctx.beginPath(); ctx.fillStyle = i===0 ? '#10b981' : (i%2===0 ? '#ef4444' : '#1e293b');
        ctx.moveTo(120,120); ctx.arc(120,120,100, ang + i*(Math.PI/6), ang + (i+1)*(Math.PI/6)); ctx.fill();
      }
      ctx.fillStyle = '#0a0d14'; ctx.beginPath(); ctx.arc(120,120,35,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(120,25,6,0,Math.PI*2); ctx.fill();
    }

    function playRoulette(choice) {
      const bet = checkBet(); if (!bet) return;
      updateBalance(-bet); showMsg("Rad dreht...", "");
      let ang = 0, speed = 0.4;
      const t = setInterval(() => {
        ang += speed; speed *= 0.96;
        drawRouletteWheel(ang);
        if (speed < 0.01) {
          clearInterval(t);
          const r = Math.random();
          let col = r < 0.08 ? 'green' : (r < 0.54 ? 'red' : 'black');
          if (choice === col) {
            const win = bet * (col==='green'?14:2); updateBalance(win);
            showMsg(`Roulette ${col.toUpperCase()}! +${win.toFixed(2)}€`, 'win');
          } else {
            showMsg(`Roulette ${col.toUpperCase()}. Verloren.`, 'lose');
          }
        }
      }, 30);
    }

    // COINFLIP
    function playCoinflip(choice) {
      const bet = checkBet(); if (!bet) return;
      updateBalance(-bet);
      const box = document.getElementById('coinBox');
      const isHeads = Math.random() < 0.5;
      box.style.transform = `rotateY(720deg)`;
      setTimeout(() => {
        box.style.transform = 'rotateY(0deg)';
        const res = isHeads ? 'Kopf' : 'Zahl';
        box.innerText = res.toUpperCase();
        if (choice === res) {
          const win = bet * 2; updateBalance(win); showMsg(`Richtig (${res})! +${win.toFixed(2)}€`, 'win');
        } else {
          showMsg(`Falsch (${res}).`, 'lose');
        }
      }, 700);
    }

    // MINES
    let mineLoc = -1, mineActive = false;
    function initMinesUI() {
      const grid = document.getElementById('minesGrid');
      grid.innerHTML = '';
      for (let i=0; i<9; i++) {
        grid.innerHTML += `<button class="grid-btn" id="m${i}" onclick="clickMine(${i})">❓</button>`;
      }
      mineActive = false;
    }
    function startMines() {
      const bet = checkBet(); if (!bet) return;
      mineLoc = Math.floor(Math.random() * 9);
      mineActive = true;
      initMinesUI();
      showMsg("Wähle ein Feld!", "");
    }
    function clickMine(idx) {
      if (!mineActive) { showMsg("Starte zuerst ein neues Feld!", "lose"); return; }
      const bet = checkBet(); if (!bet) return;
      const btn = document.getElementById(`m${idx}`);
      if (idx === mineLoc) {
        btn.innerText = '💣'; btn.style.background = '#ef4444';
        mineActive = false; updateBalance(-bet); showMsg("BOOM! Mine getroffen.", "lose");
      } else {
        btn.innerText = '💎'; btn.style.background = '#10b981'; btn.disabled = true;
        const win = bet * 1.4; updateBalance(win - bet); showMsg(`Diamant! +${(win-bet).toFixed(2)}€`, 'win');
      }
    }

    // BLACKJACK
    function playBlackjack() {
      const bet = checkBet(); if (!bet) return;
      updateBalance(-bet);
      const p = Math.floor(Math.random()*8)+14, d = Math.floor(Math.random()*8)+14;
      if (p > d && p <= 21) {
        const win = bet * 2; updateBalance(win); showMsg(`Du: ${p} vs Dealer: ${d}. +${win.toFixed(2)}€`, 'win');
      } else if (p === d) {
        updateBalance(bet); showMsg(`Unentschieden (${p}:${d}).`, '');
      } else {
        showMsg(`Dealer gewinnt (${d} vs ${p}).`, 'lose');
      }
    }

    // DICE
    function playDice() {
      const bet = checkBet(); if (!bet) return;
      updateBalance(-bet);
      const roll = Math.floor(Math.random() * 6) + 1;
      document.getElementById('diceBox').innerText = `🎲 ${roll}`;
      if (roll > 3) {
        const win = bet * 1.8; updateBalance(win); showMsg(`Gewürfelt ${roll}! +${win.toFixed(2)}€`, 'win');
      } else {
        showMsg(`Gewürfelt ${roll}. Verloren.`, 'lose');
      }
    }

    // WHEEL
    function drawSimpleWheel(ang) {
      const cvs = document.getElementById('wheelCanvas');
      if (!cvs) return;
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0,0,240,240);
      const mults = ['0x', '1.5x', '2x', '0.5x', '5x', '1x'];
      const arc = (Math.PI*2)/mults.length;
      for (let i=0; i<mults.length; i++) {
        ctx.beginPath(); ctx.fillStyle = `hsl(${i*60},70%,50%)`;
        ctx.moveTo(120,120); ctx.arc(120,120,100, ang + i*arc, ang + (i+1)*arc); ctx.fill();
        ctx.fillStyle='#fff'; ctx.font='bold 13px sans-serif';
        ctx.fillText(mults[i], 120 + Math.cos(ang + i*arc + arc/2)*60, 125 + Math.sin(ang + i*arc + arc/2)*60);
      }
    }
    function playWheel() {
      const bet = checkBet(); if (!bet) return;
      updateBalance(-bet);
      const mults = [0, 1.5, 2, 0.5, 5, 1];
      const mult = mults[Math.floor(Math.random() * mults.length)];
      let ang = 0;
      const t = setInterval(() => { ang += 0.3; drawSimpleWheel(ang); }, 30);
      setTimeout(() => {
        clearInterval(t);
        const win = bet * mult; updateBalance(win);
        showMsg(`Rad bei ${mult}x! +${win.toFixed(2)}€`, mult >= 1 ? 'win' : 'lose');
      }, 800);
    }

    // HIGHER / LOWER
    let hlVal = 7;
    function playHL(choice) {
      const bet = checkBet(); if (!bet) return;
      updateBalance(-bet);
      const next = Math.floor(Math.random() * 12) + 1;
      document.getElementById('hlVal').innerText = next;
      const win = (choice === 'higher' && next >= hlVal) || (choice === 'lower' && next <= hlVal);
      if (win) {
        const prize = bet * 1.8; updateBalance(prize); showMsg(`Karte ${next}! +${prize.toFixed(2)}€`, 'win');
      } else {
        showMsg(`Karte war ${next}. Verloren.`, 'lose');
      }
      hlVal = next;
    }

    // KENO
    function playKeno(choice) {
      const bet = checkBet(); if (!bet) return;
      updateBalance(-bet);
      const drawn = Math.floor(Math.random() * 5) + 1;
      if (choice === drawn) {
        const win = bet * 4; updateBalance(win); showMsg(`Treffer (${drawn})! +${win.toFixed(2)}€`, 'win');
      } else {
        showMsg(`Zahl war ${drawn}. Verloren.`, 'lose');
      }
    }

    initNav();
    renderGame();
    updateBalance(0);
  </script>
</body>
</html>
