<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vegas Royale VIP Casino</title>
  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: rgba(22, 28, 45, 0.95);
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.4);
      --text: #f8fafc;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(30, 41, 59, 0.8), rgba(10, 13, 20, 0.98)),
        radial-gradient(rgba(245, 158, 11, 0.08) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px;
      color: var(--text);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    #authOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 13, 20, 0.95);
      z-index: 1000; display: flex; align-items: center; justify-content: center;
    }
    .auth-box {
      background: var(--card-bg); border: 2px solid var(--accent); padding: 30px; border-radius: 20px;
      width: 350px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    }
    .auth-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; font-size: 1rem; }

    header {
      width: 100%; max-width: 950px; display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); border: 1px solid rgba(245, 158, 11, 0.2);
      padding: 15px 25px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      flex-wrap: wrap; gap: 10px;
    }

    .brand { font-size: 1.4rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }

    .user-info { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .balance-box {
      font-size: 1.1rem; font-weight: 700; background: rgba(15, 23, 42, 0.8);
      padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .balance-box span { color: var(--success); font-size: 1.2rem; }

    .switch-btn { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
    .admin-link-btn { background: var(--accent); color: #000; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 0.85rem; display: none; }
    
    .refill-btn {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white; border: none; padding: 6px 12px; border-radius: 20px;
      font-weight: bold; cursor: pointer; display: none; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }

    .nav-grid {
      width: 100%; max-width: 950px; display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-bottom: 20px;
    }

    .nav-btn {
      background: var(--card-bg); color: #94a3b8; border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 6px; border-radius: 12px; font-weight: 600; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 0.8rem;
    }
    .nav-btn:hover, .nav-btn.active {
      border-color: var(--accent); color: var(--text); background: rgba(245, 158, 11, 0.15);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .game-container {
      width: 100%; max-width: 950px; background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px;
      padding: 25px; min-height: 500px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      text-align: center; position: relative;
    }

    .bet-container { margin-top: 15px; width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .bet-preset-buttons { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .btn-chip {
      background: #1e293b; border: 1px solid rgba(245, 158, 11, 0.3); color: #f8fafc;
      padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-chip:hover { background: var(--accent); color: #000; }
    .btn-chip.all-in { background: #dc2626; border-color: #ef4444; color: white; }

    .controls { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 5px; }

    input[type="number"] {
      width: 130px; padding: 10px; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: white; text-align: center; font-size: 1.1rem; font-weight: bold;
    }

    button.action-btn {
      background: linear-gradient(135deg, var(--accent), #d97706); color: #000;
      font-weight: 800; border: none; padding: 12px 24px; border-radius: 8px;
      cursor: pointer; font-size: 1rem; box-shadow: 0 4px 15px var(--accent-glow);
    }
    button.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-msg { margin-top: 15px; font-size: 1.1rem; font-weight: bold; min-height: 28px; }
    .status-msg.win { color: var(--success); }
    .status-msg.lose { color: var(--danger); }

    .slot-machine-wrapper {
      display: flex; gap: 10px; background: #090d16; padding: 15px; border-radius: 16px;
      border: 3px solid var(--accent); box-shadow: inset 0 0 20px #000; margin: 15px 0;
    }
    .slot-reel-container {
      width: 65px; height: 80px; background: #1e293b; border-radius: 8px;
      overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.1);
    }
    .slot-reel-strip {
      display: flex; flex-direction: column; position: absolute; top: 0; left: 0; width: 100%;
      transition: transform 1.8s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    .slot-symbol { height: 80px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; }

    .dice-scene { width: 80px; height: 80px; perspective: 600px; margin: 20px auto; }
    .cube {
      width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
      transition: transform 1.5s cubic-bezier(0.2, 0.8, 0.3, 1);
    }
    .cube-face {
      position: absolute; width: 80px; height: 80px; background: #f8fafc; border: 2px solid #cbd5e1;
      border-radius: 12px; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      padding: 6px; box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
    }
    .dot { background: #0f172a; border-radius: 50%; width: 12px; height: 12px; justify-self: center; align-self: center; }
    .face-1 { transform: rotateY(0deg) translateZ(40px); }
    .face-2 { transform: rotateY(90deg) translateZ(40px); }
    .face-3 { transform: rotateY(180deg) translateZ(40px); }
    .face-4 { transform: rotateY(-90deg) translateZ(40px); }
    .face-5 { transform: rotateX(90deg) translateZ(40px); }
    .face-6 { transform: rotateX(-90deg) translateZ(40px); }

    .coin-wrapper { perspective: 1000px; margin: 15px auto; width: 100px; height: 100px; }
    .coin-3d {
      width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.15, 0.85, 0.35, 1.2);
    }
    .coin-face {
      width: 100%; height: 100%; border-radius: 50%; position: absolute; backface-visibility: hidden;
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 900;
      border: 4px solid #fef08a; box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
    }
    .coin-heads { background: linear-gradient(135deg, #f59e0b, #b45309); color: #fff; }
    .coin-tails { background: linear-gradient(135deg, #64748b, #1e293b); color: #fff; transform: rotateY(180deg); }

    .grid-3x3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
    .grid-btn {
      width: 70px; height: 70px; background: #1e293b; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; cursor: pointer; font-size: 1.8rem; display: flex; align-items: center; justify-content: center;
    }

    .wheel-wrapper { position: relative; width: 260px; height: 260px; margin: 10px auto; }
    .wheel-pointer {
      position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0;
      border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid #f59e0b;
      z-index: 10; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6));
    }

    canvas { max-width: 100%; }
  </style>
</head>
<body>

  <div id="authOverlay">
    <div class="auth-box">
      <h2>🎰 Vegas VIP Login</h2>
      <p style="font-size:0.85rem; color:#94a3b8; margin: 5px 0 15px 0;">Gib einen Accountnamen & PIN ein.</p>
      <input type="text" id="authUsername" placeholder="Benutzername">
      <input type="password" id="authPin" placeholder="PIN / Passwort">
      <button class="action-btn" style="width:100%; margin-top:10px;" onclick="handleAuth()">Einloggen / Registrieren</button>
    </div>
  </div>

  <header>
    <div class="brand">💎 Vegas VIP</div>
    <div class="user-info">
      <div class="balance-box">User: <strong id="currentUsernameDisplay" style="color:var(--accent);"></strong> | <span id="balance">100.00</span> €</div>
      <button class="switch-btn" onclick="logoutUser()">👤 Switch User</button>
      <a href="accounts.html" id="adminLinkBtn" class="admin-link-btn" target="_blank">👑 Admin Panel</a>
      <button id="refillBtn" class="refill-btn" onclick="refillBalance()">+20€ Pleite-Hilfe</button>
    </div>
  </header>

  <div class="nav-grid" id="navGrid"></div>
  <div class="game-container" id="gameContainer"></div>

  <script>
    const GAMES = [
      { id: 'slots', name: 'Slots', icon: '🎰' },
      { id: 'plinko', name: 'Plinko', icon: '⚪' },
      { id: 'roulette', name: 'Roulette', icon: '🎡' },
      { id: 'wheel', name: 'Glücksrad', icon: '🎯' },
      { id: 'coinflip', name: 'Coinflip', icon: '🪙' },
      { id: 'dice', name: 'Würfel 3D', icon: '🎲' },
      { id: 'mines', name: 'Mines', icon: '💣' },
      { id: 'crash', name: 'Crash', icon: '🚀' },
      { id: 'higherlower', name: 'Höher/Tiefer', icon: '📈' },
      { id: 'keno', name: 'Keno', icon: '🔢' }
    ];

    let allAccounts = JSON.parse(localStorage.getItem('casino_all_accounts')) || {};
    
    if (!allAccounts["admin"]) {
      allAccounts["admin"] = { pin: ".1234MALIK", balance: 1000000, isAdmin: true, stats: {} };
      localStorage.setItem('casino_all_accounts', JSON.stringify(allAccounts));
    }

    let currentAccountName = localStorage.getItem('casino_active_user') || null;
    let currentGame = 'slots';

    function setupCanvasHD(canvas, width, height) {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      return ctx;
    }

    function recordGameStat(gameId, bet, win) {
      if (!currentAccountName) return;
      allAccounts = JSON.parse(localStorage.getItem('casino_all_accounts')) || {};
      let acc = allAccounts[currentAccountName];
      if (!acc) return;
      if (!acc.stats) acc.stats = {};
      if (!acc.stats[gameId]) acc.stats[gameId] = { plays: 0, totalBet: 0, totalWin: 0 };
      
      acc.stats[gameId].plays += 1;
      acc.stats[gameId].totalBet += bet;
      acc.stats[gameId].totalWin += win;
      saveAccounts();
    }

    function handleAuth() {
      const u = document.getElementById('authUsername').value.trim();
      const p = document.getElementById('authPin').value.trim();
      if (!u || !p) { alert("Bitte Benutzername und PIN eingeben!"); return; }

      allAccounts = JSON.parse(localStorage.getItem('casino_all_accounts')) || {};

      if (!allAccounts[u]) {
        // Neuer Account wird automatisch registriert
        allAccounts[u] = { 
          pin: p, 
          balance: 100.00, 
          isAdmin: (u.toLowerCase() === 'admin'), 
          stats: {} 
        };
      } else {
        // Bestehender Account -> PIN prüfen (Admin erzwingt immer den korrekten Admin-PIN)
        if (u.toLowerCase() === 'admin' && p !== '.1234MALIK' && allAccounts['admin'].pin !== p) {
          alert("Falscher PIN für Admin!"); return;
        }
        if (allAccounts[u].pin !== p) {
          alert("Falsches Passwort / PIN!"); return;
        }
      }

      currentAccountName = u;
      saveAccounts();
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('currentUsernameDisplay').innerText = u;
      
      if (allAccounts[u].isAdmin) {
        document.getElementById('adminLinkBtn').style.display = 'inline-block';
      } else {
        document.getElementById('adminLinkBtn').style.display = 'none';
      }

      initNav();
      renderGame();
      updateBalance(0);
    }

    function logoutUser() {
      if (plinkoLoopId) cancelAnimationFrame(plinkoLoopId);
      currentAccountName = null;
      localStorage.removeItem('casino_active_user');
      document.getElementById('authOverlay').style.display = 'flex';
      document.getElementById('authUsername').value = '';
      document.getElementById('authPin').value = '';
    }

    function saveAccounts() {
      localStorage.setItem('casino_all_accounts', JSON.stringify(allAccounts));
      if (currentAccountName) {
        localStorage.setItem('casino_active_user', currentAccountName);
      }
    }

    function updateBalance(amount) {
      if (!currentAccountName) return;
      allAccounts = JSON.parse(localStorage.getItem('casino_all_accounts')) || {};
      if (!allAccounts[currentAccountName]) return;
      
      allAccounts[currentAccountName].balance += amount;
      allAccounts[currentAccountName].balance = Math.round(allAccounts[currentAccountName].balance * 100) / 100;
      saveAccounts();
      
      const bal = allAccounts[currentAccountName].balance;
      document.getElementById('balance').innerText = bal.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      document.getElementById('refillBtn').style.display = bal <= 0 ? 'block' : 'none';
    }

    function refillBalance() {
      allAccounts = JSON.parse(localStorage.getItem('casino_all_accounts')) || {};
      if (allAccounts[currentAccountName].balance <= 0) {
        updateBalance(20);
        showMsg("Du hast 20,00 € Gratis-Guthaben erhalten!", "win");
      }
    }

    function initNav() {
      const nav = document.getElementById('navGrid');
      nav.innerHTML = GAMES.map(g => `
        <button class="nav-btn ${g.id === currentGame ? 'active' : ''}" onclick="switchGame('${g.id}')">
          <span style="font-size:1.4rem">${g.icon}</span>${g.name}
        </button>
      `).join('');
    }

    function switchGame(gameId) {
      if (plinkoLoopId) { cancelAnimationFrame(plinkoLoopId); plinkoLoopId = null; }
      currentGame = gameId;
      initNav();
      renderGame();
    }

    function showMsg(text, type = '') {
      const el = document.getElementById('statusMsg');
      if (el) { el.className = `status-msg ${type}`; el.innerText = text; }
    }

    function checkBet() {
      allAccounts = JSON.parse(localStorage.getItem('casino_all_accounts')) || {};
      const bet = parseFloat(document.getElementById('betAmount')?.value || 0);
      const bal = allAccounts[currentAccountName].balance;
      if (isNaN(bet) || bet <= 0) { showMsg("Ungültiger Einsatz!", "lose"); return false; }
      if (bet > bal) { showMsg("Nicht genügend Guthaben!", "lose"); return false; }
      return bet;
    }

    function addBet(val) {
      allAccounts = JSON.parse(localStorage.getItem('casino_all_accounts')) || {};
      const inp = document.getElementById('betAmount');
      if (!inp) return;
      const bal = allAccounts[currentAccountName].balance;
      if (val === 'all') {
        inp.value = Math.max(0.1, bal);
      } else {
        let current = parseFloat(inp.value) || 0;
        let nextVal = Math.round((current + val) * 100) / 100;
        if (nextVal > bal) nextVal = bal;
        inp.value = nextVal;
      }
    }

    function getBetUI() {
      return `
        <div class="bet-container">
          <div class="bet-preset-buttons">
            <button class="btn-chip" onclick="addBet(0.1)">+0,10€</button>
            <button class="btn-chip" onclick="addBet(1)">+1€</button>
            <button class="btn-chip" onclick="addBet(10)">+10€</button>
            <button class="btn-chip" onclick="addBet(100)">+100€</button>
            <button class="btn-chip" onclick="addBet(1000)">+1.000€</button>
            <button class="btn-chip" onclick="addBet(10000)">+10.000€</button>
            <button class="btn-chip" onclick="addBet(100000)">+100.000€</button>
            <button class="btn-chip all-in" onclick="addBet('all')">ALL IN</button>
          </div>
          <div class="controls">
            <label>Einsatz (€):</label>
            <input type="number" id="betAmount" value="5" min="0.1" step="0.1">
          </div>
        </div>
      `;
    }

    function renderGame() {
      const container = document.getElementById('gameContainer');
      container.innerHTML = '';

      switch(currentGame) {
        case 'slots':
          container.innerHTML = `
            <h2>VIP Automaten Slots</h2>
            <div style="margin: 10px 0;">
              <label>Walzen Anz.: </label>
              <button class="action-btn" style="padding:4px 12px;" onclick="setSlotReels(3)">3</button>
              <button class="action-btn" style="padding:4px 12px;" onclick="setSlotReels(4)">4</button>
              <button class="action-btn" style="padding:4px 12px;" onclick="setSlotReels(5)">5</button>
            </div>
            <div class="slot-machine-wrapper" id="slotMachineWrapper"></div>
            ${getBetUI()}
            <button class="action-btn" id="slotSpinBtn" style="margin-top:15px;" onclick="playSlots()">Drehen</button>
            <div class="status-msg" id="statusMsg"></div>
          `;
          renderSlotReels();
          break;

        case 'plinko':
          container.innerHTML = `
            <h2>Plinko (Multi-Kugel Physik)</h2>
            <canvas id="plinkoCanvas"></canvas>
            ${getBetUI()}
            <button class="action-btn" style="margin-top:15px;" onclick="playPlinko()">Kugel werfen</button>
            <div class="status-msg" id="statusMsg"></div>
          `;
          initPlinkoEngine();
          break;

        case 'roulette':
          container.innerHTML = `
            <h2>Roulette</h2>
            <div class="wheel-wrapper">
              <div class="wheel-pointer"></div>
              <canvas id="rouletteCanvas"></canvas>
            </div>
            ${getBetUI()}
            <div class="controls" style="margin-top:15px;">
              <button class="action-btn" style="background:#ef4444;color:#fff;" onclick="playRoulette('red')">Rot (x2)</button>
              <button class="action-btn" style="background:#10b981;color:#fff;" onclick="playRoulette('green')">Grün (x14)</button>
              <button class="action-btn" style="background:#334155;color:#fff;" onclick="playRoulette('black')">Schwarz (x2)</button>
            </div>
            <div class="status-msg" id="statusMsg"></div>
          `;
          initRouletteHD();
          break;

        case 'wheel':
          container.innerHTML = `
            <h2>VIP Glücksrad (33% Gewinnchance!)</h2>
            <div class="wheel-wrapper">
              <div class="wheel-pointer"></div>
              <canvas id="wheelCanvas"></canvas>
            </div>
            ${getBetUI()}
            <button class="action-btn" id="wheelSpinBtn" style="margin-top:15px;" onclick="playWheel()">Rad drehen</button>
            <div class="status-msg" id="statusMsg"></div>
          `;
          initWheelHD();
          break;

        case 'coinflip':
          container.innerHTML = `
            <h2>3D Coinflip</h2>
            <div class="coin-wrapper">
              <div class="coin-3d" id="coin3D" style="transform: rotateY(0deg);">
                <div class="coin-face coin-heads">KOPF</div>
                <div class="coin-face coin-tails">ZAHL</div>
              </div>
            </div>
            ${getBetUI()}
            <div class="controls" style="margin-top:15px;">
              <button class="action-btn" onclick="playCoinflip('Kopf')">Kopf</button>
              <button class="action-btn" onclick="playCoinflip('Zahl')">Zahl</button>
            </div>
            <div class="status-msg" id="statusMsg"></div>
          `;
          break;

        case 'dice':
          container.innerHTML = `
            <h2>Echter 3D Würfel</h2>
            <div class="dice-scene">
              <div class="cube" id="cube">
                <div class="cube-face face-1"><div class="dot" style="grid-area:2/2"></div></div>
                <div class="cube-face face-2"><div class="dot" style="grid-area:1/1"></div><div class="dot" style="grid-area:3/3"></div></div>
                <div class="cube-face face-3"><div class="dot" style="grid-area:1/1"></div><div class="dot" style="grid-area:2/2"></div><div class="dot" style="grid-area:3/3"></div></div>
                <div class="cube-face face-4"><div class="dot" style="grid-area:1/1"></div><div class="dot" style="grid-area:1/3"></div><div class="dot" style="grid-area:3/1"></div><div class="dot" style="grid-area:3/3"></div></div>
                <div class="cube-face face-5"><div class="dot" style="grid-area:1/1"></div><div class="dot" style="grid-area:1/3"></div><div class="dot" style="grid-area:2/2"></div><div class="dot" style="grid-area:3/1"></div><div class="dot" style="grid-area:3/3"></div></div>
                <div class="cube-face face-6"><div class="dot" style="grid-area:1/1"></div><div class="dot" style="grid-area:1/3"></div><div class="dot" style="grid-area:2/1"></div><div class="dot" style="grid-area:2/3"></div><div class="dot" style="grid-area:3/1"></div><div class="dot" style="grid-area:3/3"></div></div>
              </div>
            </div>
            ${getBetUI()}
            <button class="action-btn" style="margin-top:15px;" onclick="playDice()">Würfeln (>3 gewinnt)</button>
            <div class="status-msg" id="statusMsg"></div>
          `;
          break;

        case 'mines':
          container.innerHTML = `
            <h2>Mines</h2>
            <div style="margin-bottom:10px;">
              <label>Bombenanzahl (1-8): </label>
              <select id="minesCountSelect" onchange="renderEmptyMinesGrid()" style="padding:5px; border-radius:6px; background:#0f172a; color:#fff; font-weight:bold;">
                ${[1,2,3,4,5,6,7,8].map(n => `<option value="${n}">${n} Bomben</option>`).join('')}
              </select>
            </div>
            <div class="grid-3x3" id="minesGrid"></div>
            ${getBetUI()}
            <div class="controls" style="margin-top:15px;">
              <button class="action-btn" id="startMinesBtn" onclick="startMines()">Spiel Starten</button>
              <button class="action-btn" id="cashoutMinesBtn" style="background:#10b981;color:#fff;display:none;" onclick="cashoutMines()">Cashout</button>
            </div>
            <div class="status-msg" id="statusMsg"></div>
          `;
          renderEmptyMinesGrid();
          break;

        case 'crash':
          container.innerHTML = `
            <h2>Crash Rocket</h2>
            <div style="font-size: 3.5rem; margin: 15px 0; font-weight:900; color:var(--accent);" id="crashVal">1.00x 🚀</div>
            ${getBetUI()}
            <div class="controls" style="margin-top:15px;">
              <button class="action-btn" id="startCrashBtn" onclick="startCrash()">Rakete Starten</button>
              <button class="action-btn" id="cashoutCrashBtn" style="background:#10b981;color:#fff;display:none;" onclick="cashoutCrash()">CASHOUT</button>
            </div>
            <div class="status-msg" id="statusMsg"></div>
          `;
          break;

        case 'higherlower':
          container.innerHTML = `
            <h2>Höher oder Tiefer</h2>
            <div style="margin:15px 0; font-size: 1.4rem;">Aktuelle Karte: <strong id="hlVal" style="color:var(--accent)">7</strong></div>
            ${getBetUI()}
            <div class="controls" style="margin-top:15px;">
              <button class="action-btn" onclick="playHL('higher')">Höher ⬆️</button>
              <button class="action-btn" onclick="playHL('lower')">Tiefer ⬇️</button>
            </div>
            <div class="status-msg" id="statusMsg"></div>
          `;
          break;

        case 'keno':
          container.innerHTML = `
            <h2>Keno (1-5 tippen)</h2>
            ${getBetUI()}
            <div class="controls" style="margin-top:15px;">
              ${[1,2,3,4,5].map(n => `<button class="action-btn" onclick="playKeno(${n})">${n}</button>`).join('')}
            </div>
            <div class="status-msg" id="statusMsg"></div>
          `;
          break;
      }
    }

    let slotReelsCount = 3;
    const slotSymbols = ['🍒', '🍋', '🍊', '💎', '7️⃣', '🔔'];
    function setSlotReels(num) { slotReelsCount = num; renderSlotReels(); }
    function renderSlotReels() {
      const wrapper = document.getElementById('slotMachineWrapper');
      if (!wrapper) return;
      wrapper.innerHTML = '';
      for (let i = 0; i < slotReelsCount; i++) {
        wrapper.innerHTML += `<div class="slot-reel-container"><div class="slot-reel-strip" id="strip${i}"><div class="slot-symbol">🍒</div></div></div>`;
      }
    }
    function playSlots() {
      const bet = checkBet(); if (!bet) return;
      updateBalance(-bet); showMsg("Walzen laufen...", "");
      document.getElementById('slotSpinBtn').disabled = true;
      const finalResults = [];
      for (let i = 0; i < slotReelsCount; i++) {
        const strip = document.getElementById(`strip${i}`);
        let stripContent = '';
        for (let s = 0; s < 15; s++) stripContent += `<div class="slot-symbol">${slotSymbols[Math.floor(Math.random() * slotSymbols.length)]}</div>`;
        const winSym = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
        finalResults.push(winSym);
        stripContent += `<div class="slot-symbol">${winSym}</div>`;
        strip.innerHTML = stripContent; strip.style.transition = 'none'; strip.style.transform = 'translateY(0px)';
        setTimeout(() => {
          strip.style.transition = `transform ${1.5 + i * 0.4}s cubic-bezier(0.1, 0.9, 0.2, 1)`;
          strip.style.transform = `translateY(-${15 * 80}px)`;
        }, 50);
      }
      setTimeout(() => {
        document.getElementById('slotSpinBtn').disabled = false;
        const counts = {};
        finalResults.forEach(s => counts[s] = (counts[s] || 0) + 1);
        let maxMatch = Math.max(...Object.values(counts));
        let win = 0;

        if (slotReelsCount === 3) {
          if (maxMatch === 3) win = bet * 10;
          else if (maxMatch === 2) win = bet * 2;
        } else if (slotReelsCount === 4) {
          if (maxMatch === 4) win = bet * 25;
          else if (maxMatch === 3) win = bet * 5;
          else if (maxMatch === 2) win = bet * 1;
        } else if (slotReelsCount === 5) {
          if (maxMatch === 5) win = bet * 50;
          else if (maxMatch === 4) win = bet * 10;
          else if (maxMatch === 3) win = bet * 1.5;
          else if (maxMatch === 2) win = 0;
        }

        updateBalance(win);
        recordGameStat('slots', bet, win);

        if (win > bet) {
          showMsg(`🎉 GEWINN! +${win.toFixed(2)}€`, 'win');
        } else if (win === bet) {
          showMsg(`Einsatz zurück erhalten! (+${win.toFixed(2)}€)`, 'win');
        } else {
          showMsg("Kein Treffer. Verloren!", "lose");
        }
      }, 1500 + slotReelsCount * 400);
    }

    let plinkoPins = [], plinkoBalls = [], plinkoSlots = [];
    let plinkoLoopId = null;
    const plinkoMults = [5, 2, 1.2, 0.5, 0.2, 0.5, 1.2, 2, 5];

    function initPlinkoEngine() {
      const cvs = document.getElementById('plinkoCanvas'); if (!cvs) return;
      const ctx = setupCanvasHD(cvs, 380, 280);
      
      plinkoPins = [];
      const rows = 7;
      for (let r = 0; r < rows; r++) {
        const count = r + 3;
        const spacing = 32;
        const startX = 190 - ((count - 1) * spacing) / 2;
        const y = 40 + r * 28;
        for (let c = 0; c < count; c++) {
          plinkoPins.push({ x: startX + c * spacing, y: y, r: 4 });
        }
      }

      plinkoSlots = [];
      const slotWidth = 380 / plinkoMults.length;
      for (let i = 0; i < plinkoMults.length; i++) {
        plinkoSlots.push({ x: i * slotWidth, w: slotWidth, mult: plinkoMults[i] });
      }

      if (!plinkoLoopId) runPlinkoLoop();
    }

    function runPlinkoLoop() {
      const cvs = document.getElementById('plinkoCanvas');
      if (!cvs || currentGame !== 'plinko') { plinkoLoopId = null; return; }
      const ctx = cvs.getContext('2d');
      
      ctx.clearRect(0, 0, 380, 280);

      ctx.fillStyle = '#94a3b8';
      for (let p of plinkoPins) {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }

      for (let i = 0; i < plinkoSlots.length; i++) {
        let s = plinkoSlots[i];
        ctx.fillStyle = s.mult >= 2 ? 'rgba(239,68,68,0.3)' : (s.mult >= 1 ? 'rgba(245,158,11,0.3)' : 'rgba(51,65,85,0.3)');
        ctx.fillRect(s.x + 2, 250, s.w - 4, 25);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(s.mult + 'x', s.x + s.w / 2, 266);
      }

      for (let i = plinkoBalls.length - 1; i >= 0; i--) {
        let b = plinkoBalls[i];
        b.vy += 0.22;
        b.x += b.vx;
        b.y += b.vy;
        b.vx *= 0.98;

        for (let p of plinkoPins) {
          let dx = b.x - p.x;
          let dy = b.y - p.y;
          let dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < b.r + p.r) {
            let angle = Math.atan2(dy, dx);
            let speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy) * 0.6;
            let scatter = (Math.random() - 0.5) * 0.5;
            b.vx = Math.cos(angle + scatter) * (speed + 0.8);
            b.vy = Math.sin(angle + scatter) * (speed + 0.8);
            b.x = p.x + Math.cos(angle) * (b.r + p.r + 0.5);
            b.y = p.y + Math.sin(angle) * (b.r + p.r + 0.5);
          }
        }

        if (b.x - b.r < 5) { b.x = 5 + b.r; b.vx *= -0.5; }
        if (b.x + b.r > 375) { b.x = 375 - b.r; b.vx *= -0.5; }

        if (b.y >= 245) {
          let slotIdx = Math.floor(b.x / (380 / plinkoMults.length));
          slotIdx = Math.max(0, Math.min(plinkoMults.length - 1, slotIdx));
          let mult = plinkoMults[slotIdx];
          let win = b.bet * mult;
          updateBalance(win);
          recordGameStat('plinko', b.bet, win);
          showMsg(`Kugel gelandet bei ${mult}x! Gewinn: +${win.toFixed(2)}€`, mult >= 1 ? 'win' : 'lose');
          plinkoBalls.splice(i, 1);
          continue;
        }

        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }

      plinkoLoopId = requestAnimationFrame(runPlinkoLoop);
    }

    function playPlinko() {
      const bet = checkBet(); if (!bet) return; updateBalance(-bet);
      const startX = 190 + (Math.random() - 0.5) * 12;
      plinkoBalls.push({ x: startX, y: 15, vx: (Math.random() - 0.5) * 0.8, vy: 0, r: 6, bet: bet });
      showMsg("Kugel geworfen...", "");
    }

    const rouletteNumbers = [
      { num: 0, color: 'green' }, { num: 32, color: 'red' }, { num: 15, color: 'black' },
      { num: 19, color: 'red' }, { num: 4, color: 'black' }, { num: 21, color: 'red' },
      { num: 2, color: 'black' }, { num: 25, color: 'red' }, { num: 17, color: 'black' },
      { num: 34, color: 'red' }, { num: 6, color: 'black' }, { num: 27, color: 'red' }
    ];
    let currentRouletteAngle = 0;

    function initRouletteHD() {
      const cvs = document.getElementById('rouletteCanvas'); if (!cvs) return;
      setupCanvasHD(cvs, 260, 260);
      drawRouletteWheel(currentRouletteAngle);
    }

    function drawRouletteWheel(ang) {
      const cvs = document.getElementById('rouletteCanvas'); if (!cvs) return;
      const ctx = cvs.getContext('2d'); ctx.clearRect(0,0,260,260);
      const slices = rouletteNumbers.length, arc = (Math.PI * 2) / slices;
      for (let i = 0; i < slices; i++) {
        const item = rouletteNumbers[i];
        ctx.beginPath(); ctx.fillStyle = item.color === 'green' ? '#10b981' : (item.color === 'red' ? '#ef4444' : '#1e293b');
        ctx.moveTo(130,130); ctx.arc(130,130,110, ang + i * arc, ang + (i + 1) * arc); ctx.fill();
        ctx.save(); ctx.translate(130,130); ctx.rotate(ang + i * arc + arc/2);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'right'; ctx.fillText(item.num, 95, 4);
        ctx.restore();
      }
      ctx.fillStyle = '#0a0d14'; ctx.beginPath(); ctx.arc(130,130,45,0,Math.PI*2); ctx.fill();
    }

    function playRoulette(choice) {
      const bet = checkBet(); if (!bet) return; updateBalance(-bet); showMsg("Roulette dreht...", "");
      const winnerIdx = Math.floor(Math.random() * rouletteNumbers.length);
      const winner = rouletteNumbers[winnerIdx];
      const sliceArc = (Math.PI * 2) / rouletteNumbers.length;
      const targetAngle = (3 * Math.PI / 2) - (winnerIdx * sliceArc + sliceArc / 2) + (Math.PI * 16);
      let startAng = currentRouletteAngle % (Math.PI * 2), startTime = null, duration = 5000;

      function animate(time) {
        if (!startTime) startTime = time;
        let progress = (time - startTime) / duration;
        if (progress > 1) progress = 1;
        let easeOut = 1 - Math.pow(1 - progress, 3);
        currentRouletteAngle = startAng + (targetAngle - startAng) * easeOut;
        drawRouletteWheel(currentRouletteAngle);
        if (progress < 1) { requestAnimationFrame(animate); }
        else {
          let win = 0;
          if (choice === winner.color) {
            const mult = winner.color === 'green' ? 14 : 2; win = bet * mult; updateBalance(win);
            showMsg(`Kugel stoppt bei ${winner.num} (${winner.color.toUpperCase()})! +${win.toFixed(2)}€`, 'win');
          } else {
            showMsg(`Kugel stoppt bei ${winner.num} (${winner.color.toUpperCase()}). Verloren!`, 'lose');
          }
          recordGameStat('roulette', bet, win);
        }
      }
      requestAnimationFrame(animate);
    }

    const wheelSlices = [
      { label: '2x', mult: 2, color: '#f59e0b', isWin: true },
      { label: '0x', mult: 0, color: '#334155', isWin: false },
      { label: '0x', mult: 0, color: '#1e293b', isWin: false },
      { label: '1.5x', mult: 1.5, color: '#10b981', isWin: true },
      { label: '0x', mult: 0, color: '#334155', isWin: false },
      { label: '0x', mult: 0, color: '#1e293b', isWin: false },
      { label: '3x', mult: 3, color: '#8b5cf6', isWin: true },
      { label: '0x', mult: 0, color: '#334155', isWin: false },
      { label: '0x', mult: 0, color: '#1e293b', isWin: false }
    ];
    let currentWheelAngle = 0;

    function initWheelHD() {
      const cvs = document.getElementById('wheelCanvas'); if (!cvs) return;
      setupCanvasHD(cvs, 260, 260);
      drawVIPWheel(currentWheelAngle);
    }

    function drawVIPWheel(ang) {
      const cvs = document.getElementById('wheelCanvas'); if (!cvs) return;
      const ctx = cvs.getContext('2d'); ctx.clearRect(0,0,260,260);
      const slices = wheelSlices.length, arc = (Math.PI * 2) / slices;
      for (let i = 0; i < slices; i++) {
        ctx.beginPath(); ctx.fillStyle = wheelSlices[i].color;
        ctx.moveTo(130, 130); ctx.arc(130, 130, 115, ang + i * arc, ang + (i + 1) * arc); ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#0a0d14'; ctx.stroke();
        ctx.save(); ctx.translate(130, 130); ctx.rotate(ang + i * arc + arc / 2);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(wheelSlices[i].label, 75, 0); ctx.restore();
      }
      ctx.fillStyle = '#0a0d14'; ctx.beginPath(); ctx.arc(130, 130, 35, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 3; ctx.stroke();
    }

    function playWheel() {
      const bet = checkBet(); if (!bet) return; updateBalance(-bet); showMsg("Glücksrad dreht...", "");
      document.getElementById('wheelSpinBtn').disabled = true;
      
      const winnerIdx = Math.floor(Math.random() * wheelSlices.length);
      const winner = wheelSlices[winnerIdx];
      const sliceArc = (Math.PI * 2) / wheelSlices.length;
      const targetAngle = (3 * Math.PI / 2) - (winnerIdx * sliceArc + sliceArc / 2) + (Math.PI * 10);
      let startAng = currentWheelAngle % (Math.PI * 2), startTime = null, duration = 4000;

      function animate(time) {
        if (!startTime) startTime = time;
        let progress = (time - startTime) / duration;
        if (progress > 1) progress = 1;
        let easeOut = 1 - Math.pow(1 - progress, 4);
        currentWheelAngle = startAng + (targetAngle - startAng) * easeOut;
        drawVIPWheel(currentWheelAngle);
        if (progress < 1) { requestAnimationFrame(animate); }
        else {
          document.getElementById('wheelSpinBtn').disabled = false;
          const win = bet * winner.mult; updateBalance(win);
          recordGameStat('wheel', bet, win);
          showMsg(`Ergebnis: ${winner.label}! Gewinn: +${win.toFixed(2)}€`, winner.mult > 0 ? 'win' : 'lose');
        }
      }
      requestAnimationFrame(animate);
    }

    let currentCoinRotation = 0;
    function playCoinflip(choice) {
      const bet = checkBet(); if (!bet) return; updateBalance(-bet);
      const coin3D = document.getElementById('coin3D');
      const isHeads = Math.random() < 0.5;
      const result = isHeads ? 'Kopf' : 'Zahl';
      
      currentCoinRotation += 1440 + (isHeads ? 0 : 180);
      coin3D.style.transform = `rotateY(${currentCoinRotation}deg)`;

      setTimeout(() => {
        let win = 0;
        if (choice === result) {
          win = bet * 2; updateBalance(win); showMsg(`Richtig (${result})! +${win.toFixed(2)}€`, 'win');
        } else { showMsg(`Falsch! Es war ${result}.`, 'lose'); }
        recordGameStat('coinflip', bet, win);
      }, 1200);
    }

    const diceRotations = { 1: {x:0, y:0}, 2: {x:0, y:-90}, 3: {x:0, y:-180}, 4: {x:0, y:90}, 5: {x:-90, y:0}, 6: {x:90, y:0} };
    function playDice() {
      const bet = checkBet(); if (!bet) return; updateBalance(-bet);
      const cube = document.getElementById('cube');
      const roll = Math.floor(Math.random() * 6) + 1;
      const rot = diceRotations[roll];
      cube.style.transform = `rotateX(${rot.x + 1440}deg) rotateY(${rot.y + 1440}deg)`;
      setTimeout(() => {
        let win = 0;
        if (roll > 3) {
          win = bet * 1.8; updateBalance(win); showMsg(`Gewürfelt: ${roll}! +${win.toFixed(2)}€`, 'win');
        } else { showMsg(`Gewürfelt: ${roll}. Verloren!`, 'lose'); }
        recordGameStat('dice', bet, win);
      }, 1500);
    }

    let minesPositions = [], minesActive = false, minesBet = 0, minesRevealedCount = 0, minesBombCount = 1;
    function renderEmptyMinesGrid() {
      const grid = document.getElementById('minesGrid'); grid.innerHTML = '';
      for (let i = 0; i < 9; i++) grid.innerHTML += `<button class="grid-btn" disabled>❓</button>`;
    }
    function startMines() {
      const bet = checkBet(); if (!bet) return; updateBalance(-bet);
      minesBet = bet;
      minesBombCount = parseInt(document.getElementById('minesCountSelect').value) || 1;
      minesActive = true; minesRevealedCount = 0;
      minesPositions = [];
      while (minesPositions.length < minesBombCount) {
        let r = Math.floor(Math.random() * 9);
        if (!minesPositions.includes(r)) minesPositions.push(r);
      }
      const grid = document.getElementById('minesGrid'); grid.innerHTML = '';
      for (let i = 0; i < 9; i++) grid.innerHTML += `<button class="grid-btn" id="mBtn${i}" onclick="clickMine(${i})">❓</button>`;
      document.getElementById('startMinesBtn').style.display = 'none';
      document.getElementById('cashoutMinesBtn').style.display = 'inline-block';
      showMsg(`${minesBombCount} Bomben aktiv. Aufdecke Blöcke!`, "");
    }
    function clickMine(idx) {
      if (!minesActive) return; const btn = document.getElementById(`mBtn${idx}`);
      if (minesPositions.includes(idx)) {
        btn.innerText = '💣'; btn.style.background = '#ef4444'; minesActive = false;
        showMsg("BOOM! Mine getroffen. Einsatz verloren!", "lose"); resetMinesControls();
        recordGameStat('mines', minesBet, 0);
      } else {
        btn.innerText = '💎'; btn.style.background = '#10b981'; btn.disabled = true; minesRevealedCount++;
        const stepMult = 1 + (minesBombCount * 0.15);
        const currentMultiplier = Math.pow(stepMult, minesRevealedCount);
        const winValue = minesBet * currentMultiplier;
        showMsg(`${minesRevealedCount} Block aufgedeckt! Auszahlung: ${winValue.toFixed(2)}€ (${currentMultiplier.toFixed(2)}x)`, 'win');
        if (minesRevealedCount === (9 - minesBombCount)) cashoutMines();
      }
    }
    function cashoutMines() {
      if (!minesActive) return;
      const stepMult = 1 + (minesBombCount * 0.15);
      const currentMultiplier = Math.pow(stepMult, minesRevealedCount);
      const win = minesBet * currentMultiplier;
      updateBalance(win);
      recordGameStat('mines', minesBet, win);
      showMsg(`CASH OUT! Gewinn: +${win.toFixed(2)}€ (${currentMultiplier.toFixed(2)}x)`, 'win');
      minesActive = false; resetMinesControls();
    }
    function resetMinesControls() {
      document.getElementById('startMinesBtn').style.display = 'inline-block';
      document.getElementById('cashoutMinesBtn').style.display = 'none';
    }

    let crashTimer = null, crashCurrentMult = 1.00, crashBetAmount = 0, crashIsRunning = false;
    function startCrash() {
      const bet = checkBet(); if (!bet) return; updateBalance(-bet);
      crashBetAmount = bet; crashCurrentMult = 1.00; crashIsRunning = true;
      document.getElementById('startCrashBtn').style.display = 'none';
      document.getElementById('cashoutCrashBtn').style.display = 'inline-block';
      showMsg("Rakete steigt...", "");

      let rand = Math.random();
      let crashPoint = rand < 0.75 ? (1.01 + Math.random() * 0.3) : (1.3 + Math.random() * 2.5);
      crashPoint = parseFloat(crashPoint.toFixed(2));

      crashTimer = setInterval(() => {
        crashCurrentMult += 0.03;
        document.getElementById('crashVal').innerText = `${crashCurrentMult.toFixed(2)}x 🚀`;

        if (crashCurrentMult >= crashPoint) {
          clearInterval(crashTimer); crashIsRunning = false;
          recordGameStat('crash', crashBetAmount, 0);
          showMsg(`💥 RAKETE GECRASHT bei ${crashPoint}x! Einsatz verloren.`, 'lose');
          resetCrashUI();
        }
      }, 60);
    }
    function cashoutCrash() {
      if (!crashIsRunning) return;
      clearInterval(crashTimer); crashIsRunning = false;
      const win = crashBetAmount * crashCurrentMult;
      updateBalance(win);
      recordGameStat('crash', crashBetAmount, win);
      showMsg(`CASH OUT ERFOLGREICH bei ${crashCurrentMult.toFixed(2)}x! +${win.toFixed(2)}€`, 'win');
      resetCrashUI();
    }
    function resetCrashUI() {
      document.getElementById('startCrashBtn').style.display = 'inline-block';
      document.getElementById('cashoutCrashBtn').style.display = 'none';
    }

    let hlVal = 7;
    function playHL(choice) {
      const bet = checkBet(); if (!bet) return; updateBalance(-bet);
      const next = Math.floor(Math.random() * 12) + 1;
      document.getElementById('hlVal').innerText = next;
      const isWin = (choice === 'higher' && next >= hlVal) || (choice === 'lower' && next <= hlVal);
      let prize = 0;
      if (isWin) {
        prize = bet * 1.8; updateBalance(prize); showMsg(`Karte war ${next}! +${prize.toFixed(2)}€`, 'win');
      } else { showMsg(`Karte war ${next}. Verloren!`, 'lose'); }
      recordGameStat('higherlower', bet, prize);
      hlVal = next;
    }

    function playKeno(choice) {
      const bet = checkBet(); if (!bet) return; updateBalance(-bet);
      const drawn = Math.floor(Math.random() * 5) + 1;
      let win = 0;
      if (choice === drawn) {
        win = bet * 4; updateBalance(win); showMsg(`Treffer (${drawn})! +${win.toFixed(2)}€`, 'win');
      } else { showMsg(`Zahl war ${drawn}. Verloren!`, 'lose'); }
      recordGameStat('keno', bet, win);
    }

    if (currentAccountName && allAccounts[currentAccountName]) {
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('currentUsernameDisplay').innerText = currentAccountName;
      if (allAccounts[currentAccountName].isAdmin) {
        document.getElementById('adminLinkBtn').style.display = 'inline-block';
      }
      initNav();
      renderGame();
      updateBalance(0);
    }
  </script>
</body>
</html>
